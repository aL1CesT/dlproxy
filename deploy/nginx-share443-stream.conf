# ===========================================================================
#  share-443 · stream fragment — 与已有 TLS 服务共用 443
# ===========================================================================
#
#  由 deploy.sh --share-443 安装到 /etc/nginx/stream-enabled/dlproxy.conf，
#  并在 /etc/nginx/nginx.conf 顶层插入一行 include（幂等）。
#  不能放进 sites-enabled/：那里处在 http{} 上下文里，stream 块会被拒。
#
#  拓扑：
#
#     client --TLS--> :443  stream (ssl_preread on)
#                      |-- 带 SNI（域名）--> 127.0.0.1:__STRIP_PORT__ 剥头器
#                      |                        '---> 127.0.0.1:__TLS_SERVICE_PORT__ 原服务
#                      '-- 不带 SNI（IP） --> 127.0.0.1:__DLPROXY_TLS_PORT__
#                                               '--> dlproxy（http 层 TLS）
#
#  为什么按"有没有 SNI"分就够了：
#    RFC 6066 禁止把 IP 字面量放进 SNI。用户拿 https://<服务器IP>/u/<token>/...
#    访问时，浏览器 / curl / aria2 根本不发 SNI；而走域名的客户端一定带 SNI。
#    两类流量天然不重叠，不需要任何应用层推断。
#
#  为什么要中间的剥头器：
#    同一个 listen 下 proxy_protocol 只能整体 on 或 off —— nginx 只接受
#    on|off|v2 三个枚举值，不接受变量（社区 PR #1713 至今未合并）。dlproxy
#    侧需要真实客户端 IP，必须 on；于是另一个后端也会收到一行 PROXY 头。
#    剥头器吃掉这行头，再以 proxy_protocol off 连向原服务，它看到的字节流
#    与直连完全一致。已实测 ClientHello 83B 进、83B 出。
#
#  替代路线（不想加剥头器时）：让原服务自己接受 PROXY protocol。
#    多数 TLS 服务并不支持，此时只能保留剥头器。
#    若你的服务支持：把 __TLS_SERVICE_PORT__ 直接指向它、删掉下面的剥头器
#    server 块，并把 upstream tls_passthrough 改名为直连 upstream。
# ===========================================================================

# 每个 SNI 归谁：空 SNI（IP 直连）永远归 dlproxy；其余归原服务。
#
# 如果你给 dlproxy 也配了域名（deploy.sh --share-443 --dlproxy-host dl.example.com），
# deploy.sh 会把下面含 __DLPROXY_SNI_ENTRY__ 的那一行替换成该域名的分流规则；
# 不给就整行删掉，效果等于"dlproxy 只能用 IP 访问"。
map $ssl_preread_server_name $dlproxy_backend {
    ""                     dlproxy_node;   # 无 SNI（IP 直连）
    # ← 这一整行会被替换成 "<域名>  dlproxy_node;"，或整行删除
    __DLPROXY_SNI_ENTRY__
    default                tls_passthrough;  # 其余任何 SNI（原服务的域名）
}

upstream dlproxy_node {
    server 127.0.0.1:__DLPROXY_TLS_PORT__;
}

upstream tls_passthrough {
    server 127.0.0.1:__STRIP_PORT__;
}

# 对外唯一的 443。ssl_preread 只读 ClientHello，不解密、不改写。
server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $dlproxy_backend;
    proxy_protocol on;            # 两个后端都会收到 PROXY 头
    proxy_connect_timeout 10s;
    proxy_timeout 3600s;          # 大文件下载动辄数小时，别切断
}

# 剥头器：接收带 PROXY 头的连接，丢掉头，以干净字节流连向原服务。
server {
    listen 127.0.0.1:__STRIP_PORT__ proxy_protocol;
    proxy_pass 127.0.0.1:__TLS_SERVICE_PORT__;
    proxy_protocol off;           # 关键：不给原服务发 PROXY 头
    proxy_connect_timeout 10s;
    proxy_timeout 3600s;
}
