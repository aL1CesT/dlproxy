# ===========================================================================
#  share-443 · http fragment — dlproxy 的 TLS 站点，监听回环 8443
# ===========================================================================
#
#  由 deploy.sh --share-443 安装到 /etc/nginx/sites-available/dlproxy。
#  443 归 stream 层所有（见 nginx-share443-stream.conf），这里只接受来自
#  stream 层的连接，因此必须绑在回环上：外部直连 8443 会绕过 SNI 分流，
#  也让 X-Real-IP 变成可伪造。
#
#  与默认 nginx.conf 的 443 server 块相比，只多了两处：
#    * listen 改成 127.0.0.1:__DLPROXY_TLS_PORT__ ssl proxy_protocol
#    * 增加 set_real_ip_from / real_ip_header proxy_protocol
#  其余指令一字未改。
#
#  铁律：proxy_pass 不能带 URI 部分（不能有结尾斜杠），否则 nginx 会改写
#  URI —— 把 "https://host/path" 压成 "https:/host/path"，整个服务的基础
#  就没了。已在 nginx 1.28.3 上实测，见 tools/e2e_nginx.py。
# ===========================================================================

# :80 照旧归 dlproxy —— 那个服务只占了 443。这一块与默认 nginx.conf 完全相同：
# http-01 永远在 80 上校验，而 shortlived 证书的授权复用期只有 7 小时，
# 远短于 80 小时的续期间隔，所以每次续期都要重新跑一次挑战，80 必须常开。
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:__DLPROXY_TLS_PORT__ ssl proxy_protocol;
    __HTTP2_DIRECTIVE__
    server_name __SERVER_NAME__;

    ssl_certificate     __CERT_FULLCHAIN__;
    ssl_certificate_key __CERT_PRIVKEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # 真实客户端 IP 由 stream 层的 PROXY 头带进来。
    set_real_ip_from 127.0.0.1;
    real_ip_header   proxy_protocol;

    server_tokens off;
    # 管理页路径是 URL 里的秘密，不要交给第三方 Referer。
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # 页面里有少量内联脚本与内联 onsubmit/onclick 守卫，所以 script-src 需要
    # 'unsafe-inline'；其余一律同源：不引 CDN、不引字体、不向站外发请求。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    # 访问 token 在路径里（/u/<token>/...），默认访问日志会把每一条分享链接落盘。
    access_log off;

    # 基础设施超时，不是限速：200 GB 在 5 MB/s 下要跑十一小时。
    proxy_connect_timeout 10s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;
    send_timeout          3600s;

    # 直通不落盘：缓冲会把几 GB 的响应写进磁盘，而且根盘也放不下。
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;

    # 只有 git-upload-pack 带 body，其余都是 GET。
    client_max_body_size 10m;

    # 不设 limit_conn / limit_req / 带宽上限：并发由应用的 settings 表控制，
    # 管理员可在管理面板调。
    location / {
        proxy_pass http://127.0.0.1:8080;      # 无 URI、无结尾斜杠，铁律
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
