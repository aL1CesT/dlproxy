# Replace __CERT_FULLCHAIN__ and __CERT_PRIVKEY__ with real paths before use.
# deploy.sh installs a throwaway self-signed pair first so nginx can start and
# answer the ACME challenge, then swaps in /etc/letsencrypt/live/<IP>/...
#
# The ACME location lives in the :80 block only, which is correct: http-01
# always validates on port 80, and the shortlived profile's 7-hour authorization
# reuse window means every renewal runs a fresh challenge. Port 80 must stay
# open permanently, not just at first issuance.
#
# THE ONE RULE THAT MATTERS: proxy_pass must NOT carry a URI part.
#
#   proxy_pass http://127.0.0.1:8080;      # correct — request URI is relayed raw
#   proxy_pass http://127.0.0.1:8080/;     # WRONG — see below
#
# With a trailing slash (or any URI component) nginx rewrites the URI before
# proxying: it applies merge_slashes, collapses "/a//b" to "/a/b" and, fatally,
# turns "https://host/path" into "https:/host/path". That destroys the embedded
# absolute URL this service is built around. This was verified against nginx
# 1.28.3 — see tools/e2e_nginx.sh, which asserts it on every run.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # ACME HTTP-01 challenge. Must stay ahead of the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl__DEFAULT_SERVER__;
    listen [::]:443 ssl__DEFAULT_SERVER__;
    __HTTP2_DIRECTIVE__
    server_name __SERVER_NAME__;

    ssl_certificate     __CERT_FULLCHAIN__;
    ssl_certificate_key __CERT_PRIVKEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    server_tokens off;
    # The admin path is a secret in the URL; do not hand it to third parties.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # The pages carry small inline scripts and inline onsubmit/onclick guards,
    # so script-src needs 'unsafe-inline'. Everything else stays first-party:
    # no CDN, no fonts, no XHR targets beyond this origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    # Access tokens travel in the path (/u/<token>/...), so the default access
    # log would write every shared download link to disk. Off for this vhost.
    access_log off;

    # Infrastructure timeouts, not rate limits: a 200 GB download at 5 MB/s runs
    # for eleven hours and must not be cut in half by a proxy timeout.
    proxy_connect_timeout 10s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;
    send_timeout          3600s;

    # Stream straight through. Buffering would spool multi-gigabyte bodies to
    # disk, and the root disk could not afford it anyway.
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;

    # Only git-upload-pack carries a body; everything else is GET.
    client_max_body_size 10m;

    # No limit_conn / limit_req / bandwidth caps here by design: the application
    # enforces concurrency from the settings table so the admin can tune it.

    location / {
        proxy_pass http://127.0.0.1:8080;      # <-- no URI part, no trailing slash
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
