# /etc/logrotate.d/dlproxy
#
# Access logs are of little forensic value beyond a week; the security log is
# the one worth keeping, at 90 days.
#
# The size cap is the important part: this box has a 47 GB root disk shared with
# the OS, and an unbounded log directory is the classic way to fill it. When the
# directory passes 5 GB the oldest rotated files are deleted outright.

/var/log/nginx/access.log
/var/log/nginx/error.log {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        [ -f /run/nginx.pid ] && kill -USR1 "$(cat /run/nginx.pid)" 2>/dev/null || true
    endscript
}

/var/log/dlproxy/*.log {
    daily
    rotate 90
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su dlproxy dlproxy
    sharedscripts
    postrotate
        # Keep the whole log directory under 5 GB: drop the oldest archives
        # until it fits. Guarded so an empty glob cannot delete anything odd.
        dir=/var/log/dlproxy
        while [ "$(du -sm "$dir" 2>/dev/null | awk '{print $1+0}')" -gt 5120 ]; do
            oldest=$(ls -1t "$dir"/*.gz 2>/dev/null | tail -1)
            [ -n "$oldest" ] || break
            rm -f "$oldest"
        done
    endscript
}
